<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SF Story Browser</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #f7f7f8;
    --surface: #ffffff;
    --surface2:#f0f0f2;
    --accent:  #d97757;
    --accent-d:#c4623d;
    --accent-l:#fff4ef;
    --green:   #16a34a;
    --blue:    #2563eb;
    --text:    #111827;
    --text2:   #374151;
    --muted:   #9ca3af;
    --border:  #e5e7eb;
    --shadow:  0 1px 3px rgba(0,0,0,.07);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; font-size: 15px; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 10;
  }
  .logo { font-weight: 700; font-size: 16px; color: var(--text); letter-spacing: -.02em; flex: 1; }
  .logo span { color: var(--accent); }
  #totalLabel { font-size: .82rem; color: var(--muted); }

  nav { display: flex; gap: 4px; }
  nav a {
    padding: 6px 12px; border-radius: 7px; color: var(--text2);
    font-size: 14px; text-decoration: none; font-weight: 500;
  }
  nav a:hover { background: var(--bg); }
  nav a.active { background: var(--accent-l); color: var(--accent); }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .toolbar input, .toolbar select {
    background: var(--bg); border: 1.5px solid var(--border);
    color: var(--text); border-radius: 7px; padding: 7px 10px; font-size: 14px;
    font-family: var(--font); outline: none; transition: border-color .15s;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
  #searchInput { width: 220px; }
  .sort-group { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .sort-group label { font-size: .78rem; color: var(--muted); }

  .content { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }

  .story-grid { display: flex; flex-direction: column; gap: 10px; }

  .story-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 20px; cursor: pointer;
    transition: border-color .15s, box-shadow .15s; box-shadow: var(--shadow);
  }
  .story-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(217,119,87,.12); }
  .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    font-weight: 600; letter-spacing: .04em;
  }
  .chip-company { background: #fef3eb; color: var(--accent); }
  .chip-area    { background: var(--surface2); color: var(--text2); }
  .chip-id      { font-family: var(--mono); background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .card-principle { font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--text); }

  .card-body { display: none; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
  .card-body.open { display: block; }
  .star-row { display: grid; grid-template-columns: 90px 1fr; gap: 6px 14px; margin-bottom: 10px; }
  .star-lbl { font-size: 12px; color: var(--accent); font-weight: 700; font-family: var(--mono); padding-top: 3px; text-transform: uppercase; letter-spacing: .05em; }
  .star-val { font-size: 14px; line-height: 1.65; color: var(--text2); white-space: pre-wrap; }
  .card-source { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); word-break: break-all; }
  .card-source a { color: var(--muted); }
  .card-source a:hover { color: var(--accent); }
  .btn-enrich {
    margin-top: 12px; padding: 5px 14px; font-size: 13px; font-weight: 600;
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 7px; cursor: pointer; color: var(--text2); font-family: var(--font);
    transition: border-color .15s, color .15s;
  }
  .btn-enrich:hover { border-color: var(--accent); color: var(--accent); }
  .btn-enrich:disabled { opacity: .5; cursor: default; }

  /* Badge — виден в хедере даже когда карточка свёрнута */
  .badge-enriched {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
    background: #16a34a; color: #fff;
    box-shadow: 0 1px 4px #16a34a44;
  }

  /* Разделитель перед обогащённым блоком */
  .enriched-label {
    margin-top: 18px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: #16a34a;
  }
  .enriched-label::after {
    content: ''; flex: 1; height: 1px; background: #16a34a44;
  }

  /* Сам блок с обогащённым текстом */
  .enriched-block {
    padding: 14px 16px;
    background: #f0fdf4;
    border: 1.5px solid #86efac;
    border-radius: 8px;
    font-size: 14px; line-height: 1.7; color: var(--text);
    white-space: pre-wrap;
  }
  @media (prefers-color-scheme: dark) {
    .enriched-block { background: #052e16; border-color: #166534; color: #d1fae5; }
    .badge-enriched { background: #166534; }
    .enriched-label { color: #4ade80; }
    .enriched-label::after { background: #166534; }
  }
  .enriched-sources {
    margin-top: 10px; padding: 8px 12px;
    background: var(--surface2); border-radius: 6px;
    font-size: 12px; color: var(--muted); word-break: break-all; line-height: 1.8;
  }

  .pagination { display: flex; gap: 8px; justify-content: center; align-items: center; padding: 24px 0; }
  .page-btn {
    padding: 6px 14px; background: var(--surface); border: 1px solid var(--border);
    color: var(--text2); border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  .page-btn:hover { border-color: var(--accent); color: var(--accent); }
  .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .page-btn:disabled { opacity: .35; cursor: default; }
  #pageInfo { font-size: 14px; color: var(--muted); padding: 0 8px; }

  .empty { text-align: center; color: var(--muted); padding: 60px; font-size: 15px; }
  .loading { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <span class="logo">Someday <span>Founder</span></span>
  <span id="totalLabel">Loading…</span>
  <nav>
    <a href="/monitor">Monitor</a>
    <a href="/browser" class="active">Stories</a>
  </nav>
</header>

<div class="toolbar">
  <input id="searchInput" type="text" placeholder="Search stories…" oninput="debounceSearch()" />
  <select id="companyFilter" onchange="applyFilters()">
    <option value="">All companies</option>
  </select>
  <select id="areaFilter" onchange="applyFilters()">
    <option value="">All areas</option>
  </select>
  <div class="sort-group">
    <label>Sort</label>
    <select id="sortField" onchange="applyFilters()">
      <option value="created_at">Date added</option>
      <option value="company">Company</option>
      <option value="area">Area</option>
      <option value="principle">Principle</option>
    </select>
    <select id="sortOrder" onchange="applyFilters()">
      <option value="desc">↓ Desc</option>
      <option value="asc">↑ Asc</option>
    </select>
  </div>
</div>

<div class="content">
  <div id="storyGrid" class="story-grid"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
let currentPage = 1;
const PER_PAGE = 50;
let searchTimer = null;
let expandedIds = new Set();

function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilters, 300);
}

function applyFilters() {
  currentPage = 1;
  loadStories();
}

async function loadMeta() {
  const [companies, areas] = await Promise.all([
    fetch('/api/companies').then(r=>r.json()),
    fetch('/api/areas').then(r=>r.json()),
  ]);
  const cs = document.getElementById('companyFilter');
  companies.forEach(c => { const o = new Option(c,c); cs.appendChild(o); });
  const as = document.getElementById('areaFilter');
  areas.forEach(a => { const o = new Option(a,a); as.appendChild(o); });
}

async function loadStories() {
  const q      = document.getElementById('searchInput').value.trim();
  const company= document.getElementById('companyFilter').value;
  const area   = document.getElementById('areaFilter').value;
  const sort   = document.getElementById('sortField').value;
  const order  = document.getElementById('sortOrder').value;

  const grid = document.getElementById('storyGrid');
  grid.innerHTML = '<div class="loading">Loading…</div>';

  const params = new URLSearchParams({ page: currentPage, per_page: PER_PAGE, sort, order });
  if (q)       params.set('q', q);
  if (company) params.set('company', company);
  if (area)    params.set('area', area);

  const data = await fetch('/api/stories?' + params).then(r => r.json());

  document.getElementById('totalLabel').textContent =
    data.total + ' stories';

  if (!data.stories.length) {
    grid.innerHTML = '<div class="empty">No stories found. Run the pipeline from the <a href="/monitor" style="color:var(--accent)">Monitor</a>.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  grid.innerHTML = data.stories.map(s => renderCard(s)).join('');
  renderPagination(data.total);
}

function renderCard(s) {
  const expanded = expandedIds.has(s.id);
  const urls = tryParseUrls(s.source_urls);
  return `<div class="story-card" onclick="toggleCard(${s.id}, this)">
    <div class="card-header">
      <span class="chip chip-company">${esc(s.company)}</span>
      <span class="chip chip-area">${esc(s.area)}</span>
      <span class="chip chip-id">${esc(s.story_id||'')}</span>
    </div>
    <div class="card-principle">${esc(s.principle||'')}</div>
    <div class="card-body${expanded?' open':''}">
      ${starRow('Story', s.situation)}
      ${starRow('Mechanism', s.task)}
      ${starRow('Terms', s.action)}
      ${urls.length ? `<div class="card-source">Sources: ${urls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.length>60?u.slice(0,60)+'…':u)}</a>`).join(' · ')}</div>` : ''}
      <div class="card-source" style="margin-top:6px;color:var(--muted)">Added: ${(s.created_at||'').slice(0,16)}</div>
      <button class="btn-enrich" id="enrich-btn-${s.id}" onclick="enrichStory(${s.id}, event)">⚡ Enrich</button>
      <div id="enriched-${s.id}"></div>
    </div>
  </div>`;
}

function starRow(lbl, val) {
  if (!val || val.trim() === '') return '';
  return `<div class="star-row"><span class="star-lbl">${lbl}</span><span class="star-val">${esc(val)}</span></div>`;
}

function tryParseUrls(raw) {
  try { return JSON.parse(raw || '[]'); } catch { return []; }
}

function toggleCard(id, el) {
  const body = el.querySelector('.card-body');
  if (body.classList.toggle('open')) {
    expandedIds.add(id);
  } else {
    expandedIds.delete(id);
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderPagination(total) {
  const totalPages = Math.ceil(total / PER_PAGE);
  if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
  let html = `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">← Prev</button>`;
  html += `<span id="pageInfo">Page ${currentPage} / ${totalPages}</span>`;
  html += `<button class="page-btn" ${currentPage>=totalPages?'disabled':''} onclick="goPage(${currentPage+1})">Next →</button>`;
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  loadStories();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function enrichStory(id, event) {
  event.stopPropagation();
  const btn = document.getElementById('enrich-btn-' + id);
  const out = document.getElementById('enriched-' + id);
  btn.disabled = true;
  btn.textContent = '⏳ Searching…';
  out.innerHTML = '';
  try {
    const data = await fetch('/api/enrich', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({story_id: id})
    }).then(r => r.json());

    if (data.error) {
      out.innerHTML = `<div class="enriched-block" style="border-color:var(--muted);background:#fff8">${esc(data.error)}</div>`;
    } else {
      const text = data.enriched_action || '';
      const srcIdx = text.indexOf('ИСТОЧНИКИ:');
      const body = srcIdx >= 0 ? text.slice(0, srcIdx).trim() : text.trim();
      const sources = data.sources || [];
      const srcLines = sources.map(u =>
        `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.length>70?u.slice(0,70)+'…':u)}</a>`
      ).join('<br>');
      const srcCount = sources.length;
      out.innerHTML =
        `<div class="enriched-label">● Обогащено · ${srcCount} ${srcCount===1?'источник':srcCount<5?'источника':'источников'}</div>` +
        `<div class="enriched-block">${esc(body)}</div>` +
        (srcLines ? `<div class="enriched-sources">${srcLines}</div>` : '');
      // Добавляем бейджик в хедер карточки
      const card = btn.closest('.story-card');
      if (card && !card.querySelector('.badge-enriched')) {
        card.querySelector('.card-header').insertAdjacentHTML(
          'beforeend', `<span class="badge-enriched">✓ enriched</span>`
        );
      }
    }
    btn.textContent = '✓ Enriched';
  } catch(e) {
    out.innerHTML = `<div class="enriched-block" style="border-color:var(--muted)">Error: ${esc(String(e))}</div>`;
    btn.textContent = '⚡ Enrich';
    btn.disabled = false;
  }
}

loadMeta().then(loadStories);
</script>
</body>
</html>
