name: Gemotest Pipeline

on:
  workflow_dispatch:
    inputs:
      analysis_name:
        description: "Название анализа (напр. ТТГ)"
        required: true
      blocks:
        description: "ID блоков через запятую (пусто = все)"
        required: false
        default: ""
      seo_tz:
        description: "SEO ТЗ в формате markdown (опционально)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r gemotest_pipeline/requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          SERPER_API_KEY: ${{ secrets.SERPER }}
          TAVILY_API_KEY: ${{ secrets.TAVILY }}
          SEO_TZ_CONTENT: ${{ inputs.seo_tz }}
        run: |
          python -m gemotest_pipeline.pipeline.pipeline \
            --analysis "${{ inputs.analysis_name }}" \
            --blocks "${{ inputs.blocks }}"

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gemotest_pipeline/results/
          git diff --cached --quiet || git commit -m "result: ${{ inputs.analysis_name }}"
          git push
